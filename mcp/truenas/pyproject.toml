[project]
name = "truenas-mcp"
version = "0.1.0"
description = "MCP server for TrueNAS Scale"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "truenas-api-client",
]

[project.scripts]
truenas-mcp = "main:mcp.run"

[tool.uv.sources]
truenas-api-client = { git = "https://github.com/truenas/api_client.git", rev = "release/25.10.7" }
